# Builds the APK on every push to main and publishes it as a GitHub release.
# Fixed download link (works in the Downloader app on the TV/tablet):
#   https://github.com/qatar4u/qatar4u-tv/releases/latest/download/qatar4u-tv.apk
name: Build and release APK

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "rollback/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - id: java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-24.04 runners ship the Android SDK with licenses accepted.
      - id: sdk
        name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-34" "build-tools;34.0.0" > /dev/null || true

      - id: gradle
        uses: gradle/actions/setup-gradle@v4

      # Same signing key on every build, so a new APK installs over the old one.
      - name: Use the fixed sideload key
        run: |
          mkdir -p ~/.android
          cp ci/sideload-debug.keystore ~/.android/debug.keystore

      - name: Build
        id: build
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleRelease 2>&1 | tee build.log
          cp app/build/outputs/apk/release/app-release.apk qatar4u-tv.apk

      - name: Read version
        id: ver
        run: |
          v=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "tag=v${v}" >> "$GITHUB_OUTPUT"
          echo "name=Qatar4u TV ${v}" >> "$GITHUB_OUTPUT"
          # Release post from .github/RELEASE_NOTES.md, with this version's tag in the version link.
          sed "s#{{TAG}}#v${v}#g" .github/RELEASE_NOTES.md > release-notes.md

      # One post only: remove every earlier release and its tag before publishing the new one.
      - name: Remove earlier releases
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: |
          gh release list -R "$GITHUB_REPOSITORY" --limit 100 --json tagName -q '.[].tagName' |
            while read -r t; do gh release delete "$t" -R "$GITHUB_REPOSITORY" --yes --cleanup-tag; done

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.name }}
          target_commitish: ${{ github.sha }}
          make_latest: "true"
          files: qatar4u-tv.apk
          body_path: release-notes.md
          # With the owner's token the release is published as qatar4u, not github-actions.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      # The run log isn't reachable from outside GitHub, so put the failure in an annotation.
      - name: Report failure
        if: failure()
        run: |
          echo "steps: java=${{ steps.java.outcome }} sdk=${{ steps.sdk.outcome }} gradle=${{ steps.gradle.outcome }} build=${{ steps.build.outcome }}"
          if [ -f build.log ]; then
            msg=$(grep -E "^e: |error:|FAILURE|What went wrong|> |Execution failed|Could not" build.log | head -40)
            [ -z "$msg" ] && msg=$(tail -40 build.log)
          else
            msg="build step did not run (java=${{ steps.java.outcome }} sdk=${{ steps.sdk.outcome }} gradle=${{ steps.gradle.outcome }})"
          fi
          msg="${msg//'%'/'%25'}"; msg="${msg//$'\n'/'%0A'}"; msg="${msg//$'\r'/}"
          echo "::error title=Build failed::$msg"
