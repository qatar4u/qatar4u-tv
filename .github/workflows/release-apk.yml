# Validates changes and uploads a test APK. Publishing requires a manual main-branch run.
# Fixed download link (works in the Downloader app on the TV/tablet):
#   https://github.com/qatar4u/qatar4u-tv/releases/latest/download/qatar4u-tv.apk
name: Build and release APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a new release after device testing and review"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - id: java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-24.04 runners ship the Android SDK with licenses accepted.
      - id: sdk
        name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - id: gradle
        uses: gradle/actions/setup-gradle@v4

      # Same signing key on every build, so a new APK installs over the old one.
      - name: Use the fixed sideload key
        run: |
          mkdir -p ~/.android
          cp ci/sideload-debug.keystore ~/.android/debug.keystore

      - name: Build
        id: build
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace testDebugUnitTest lintDebug assembleRelease 2>&1 | tee build.log
          cp app/build/outputs/apk/release/app-release.apk qatar4u-tv.apk

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports-${{ github.run_id }}
          path: |
            app/build/reports/
            app/build/test-results/
            build.log
          if-no-files-found: warn

      - name: Upload candidate APK
        uses: actions/upload-artifact@v4
        with:
          name: Qatar4u-TV-candidate-${{ github.run_id }}
          path: qatar4u-tv.apk
          retention-days: 30

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: publish-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: Qatar4u-TV-candidate-${{ github.run_id }}

      - name: Read version and require an unused tag
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          v=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          test -n "$v"
          if git ls-remote --exit-code --tags origin "refs/tags/v${v}"; then
            echo "::error::Tag v${v} already exists. Increment the version before publishing."
            exit 1
          else
            status=$?
            # Exit 2 means no matching ref. A network failure must not be treated as a new version.
            test "$status" -eq 2
          fi
          echo "tag=v${v}" >> "$GITHUB_OUTPUT"
          echo "name=Qatar4u TV ${v}" >> "$GITHUB_OUTPUT"
          sed "s#{{TAG}}#v${v}#g" .github/RELEASE_NOTES.md > release-notes.md

      - name: Publish reviewed release (keep previous releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.name }}
          target_commitish: ${{ github.sha }}
          make_latest: "true"
          files: qatar4u-tv.apk
          body_path: release-notes.md
          token: ${{ github.token }}
